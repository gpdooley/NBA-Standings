<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Standings Prediction League</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    th, td { padding: 12px 16px; text-align: left; }
    th { background: #334155; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
    .player-row { cursor: pointer; border-bottom: 1px solid #334155; transition: background 0.2s; }
    .player-row:hover { background: #334155; }
    .rank-col { font-weight: bold; color: #38bdf8; width: 50px; }
    .points-col { text-align: right; font-weight: bold; width: 100px; }
    .conf-badge { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; background: #0f172a; margin-left: 6px; color: #cbd5e1; }
    .details-row { display: none; background: #0f172a; }
    .details-row.open { display: table-row; }
    .conf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    @media (max-width: 650px) { .conf-grid { grid-template-columns: 1fr; } }
    .conf-title { font-weight: bold; color: #38bdf8; margin-bottom: 8px; text-transform: uppercase; font-size: 0.9rem; }
    .sub-table { font-size: 0.85rem; }
    .sub-table th { background: #1e293b; }
    .pts-zero { color: #4ade80; font-weight: bold; }
    .pts-high { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏀 NBA Conference Predictions</h1>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th style="text-align:right;">Total Score</th>
        </tr>
      </thead>
      <tbody id="standings-body">
        <tr><td colspan="3" style="text-align:center; padding: 20px;">Loading standings...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZDWO4B59VhKcnglNniejrPPFxZ6yLvFnF_TsGIjba3D0wiOYm-X9L-7Q7GC1oipJK/exec";

    async function fetchStandings() {
      const tbody = document.getElementById('standings-body');
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No standings data available yet.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map((player, idx) => {
          const rowId = `details-${idx}`;
          return `
            <tr class="player-row" onclick="toggleDetails('${rowId}')">
              <td class="rank-col">${player.rank}</td>
              <td>
                <strong>${escapeHtml(player.name)}</strong>
                <span class="conf-badge">E: ${player.eastPoints}pt</span>
                <span class="conf-badge">W: ${player.westPoints}pt</span>
              </td>
              <td class="points-col">${player.points} pts</td>
            </tr>
            <tr id="${rowId}" class="details-row">
              <td colspan="3">
                <div class="conf-grid">
                  <div>
                    <div class="conf-title">Eastern Conference</div>
                    ${renderConfTable(player.breakdown.east)}
                  </div>
                  <div>
                    <div class="conf-title">Western Conference</div>
                    ${renderConfTable(player.breakdown.west)}
                  </div>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Unable to load standings.</td></tr>';
      }
    }

    function renderConfTable(breakdown) {
      if (!breakdown || breakdown.length === 0) return '<div>No data</div>';
      const rows = breakdown.map(b => {
        let ptsClass = b.points === 0 ? 'pts-zero' : (b.points >= 5 ? 'pts-high' : '');
        return `
          <tr>
            <td style="text-align:center;">${b.predictedRank}</td>
            <td>${escapeHtml(b.teamName)}</td>
            <td style="text-align:center;">${b.actualRank}</td>
            <td style="text-align:right;" class="${ptsClass}">+${b.points}</td>
          </tr>
        `;
      }).join('');

      return `
        <table class="sub-table">
          <thead>
            <tr>
              <th style="width:30px;">Pick</th>
              <th>Team</th>
              <th style="width:40px;">Live</th>
              <th style="width:40px; text-align:right;">Pts</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function toggleDetails(rowId) {
      const el = document.getElementById(rowId);
      el.classList.toggle('open');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    fetchStandings();
  </script>
</body>
</html>
